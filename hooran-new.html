<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>هوران هنر ماندگار البرز | سیستم تخصصی پروژه‌های اداری</title>

<meta name="description" content="سیستم تخصصی هوران برای برداشت، طراحی، آنالیز ساخت، سفارش متریال، هماهنگی تولید، اجرا و تحویل پروژه‌های اداری.">

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:"Vazirmatn",Tahoma,Arial,sans-serif;
    background:#071116;
    color:#eef7f7;
    line-height:2;
    font-weight:400;
}

a{
    color:inherit;
    text-decoration:none;
}

.container{
    width:min(1180px,92%);
    margin:auto;
}

/* HEADER */

header{
    position:sticky;
    top:0;
    z-index:1000;
    background:rgba(7,17,22,.88);
    backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);
    border-bottom:1px solid rgba(255,255,255,.08);
}

.nav{
    min-height:82px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:25px;
}

.logo{
    display:flex;
    align-items:center;
    gap:13px;
    color:#fff;
}

.logo-mark{
    width:48px;
    height:48px;
    border-radius:15px;
    display:grid;
    place-items:center;
    background:linear-gradient(135deg,#35d9c8,#1687a1);
    color:#061014;
    font-size:25px;
    font-weight:800;
    box-shadow:0 8px 28px rgba(35,214,197,.18);
}

.logo-text{
    display:flex;
    flex-direction:column;
    line-height:1.35;
}

.logo-text strong{
    font-size:21px;
    font-weight:800;
    letter-spacing:-.6px;
}

.logo-text span{
    font-size:11px;
    color:#91a6aa;
    font-weight:400;
    margin-top:2px;
}

.nav-links{
    display:flex;
    gap:27px;
    font-size:13px;
    color:#b9cbce;
}

.nav-links a{
    transition:.25s ease;
}

.nav-links a:hover{
    color:#35d7c6;
}

/* HERO */

.hero{
    min-height:720px;
    display:flex;
    align-items:center;
    position:relative;
    overflow:hidden;
}

.hero::before{
    content:"";
    position:absolute;
    width:500px;
    height:500px;
    border-radius:50%;
    background:rgba(25,205,190,.10);
    filter:blur(80px);
    top:-150px;
    right:-100px;
}

.hero::after{
    content:"";
    position:absolute;
    width:420px;
    height:420px;
    border-radius:50%;
    background:rgba(40,120,255,.08);
    filter:blur(80px);
    bottom:-180px;
    left:-100px;
}

.hero-content{
    position:relative;
    z-index:2;
    max-width:850px;
}

.badge{
    display:inline-block;
    padding:6px 16px;
    border:1px solid rgba(53,215,198,.35);
    background:rgba(53,215,198,.07);
    color:#55dfd0;
    border-radius:50px;
    font-size:12px;
    margin-bottom:25px;
    font-weight:500;
}

h1{
    font-size:clamp(40px,6vw,72px);
    line-height:1.35;
    margin-bottom:25px;
    letter-spacing:-1.5px;
    font-weight:800;
}

.gradient{
    background:linear-gradient(90deg,#62e7da,#53aeea);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
}

.hero p{
    color:#b7c8cb;
    max-width:720px;
    font-size:17px;
    line-height:2.2;
    margin-bottom:35px;
}

.buttons{
    display:flex;
    flex-wrap:wrap;
    gap:14px;
}

.btn{
    padding:12px 24px;
    border-radius:12px;
    font-weight:600;
    display:inline-block;
    transition:.25s ease;
    font-family:inherit;
}

.btn-primary{
    background:linear-gradient(135deg,#2ed8c5,#208faa);
    color:#061014;
}

.btn-primary:hover{
    transform:translateY(-2px);
    box-shadow:0 10px 28px rgba(46,216,197,.16);
}

.btn-secondary{
    border:1px solid rgba(255,255,255,.14);
    background:rgba(255,255,255,.04);
}

.btn-secondary:hover{
    background:rgba(255,255,255,.08);
}

/* SECTIONS */

section{
    padding:100px 0;
}

.section-title{
    max-width:720px;
    margin-bottom:45px;
}

.section-title span{
    color:#45d9ca;
    font-size:12px;
    font-weight:600;
    letter-spacing:1px;
}

.section-title h2{
    font-size:36px;
    margin:8px 0 14px;
    font-weight:800;
    letter-spacing:-.8px;
}

.section-title p{
    color:#9eb1b5;
    font-size:15px;
}

/* GLASS */

.glass{
    background:linear-gradient(
        145deg,
        rgba(255,255,255,.075),
        rgba(255,255,255,.025)
    );
    border:1px solid rgba(255,255,255,.09);
    border-radius:22px;
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
}

/* SYSTEM */

.steps{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:18px;
}

.step{
    padding:28px;
    min-height:205px;
    transition:.25s ease;
}

.step:hover{
    transform:translateY(-4px);
    border-color:rgba(53,215,198,.20);
}

.number{
    font-size:12px;
    color:#42d8ca;
    margin-bottom:18px;
    font-weight:700;
    direction:ltr;
    text-align:right;
}

.step h3{
    margin-bottom:10px;
    font-size:19px;
    font-weight:700;
}

.step p{
    color:#9eb1b5;
    font-size:13px;
    line-height:2;
}

/* SERVICES */

.services{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:18px;
}

.service{
    padding:28px;
    transition:.25s ease;
}

.service:hover{
    transform:translateY(-4px);
    border-color:rgba(53,215,198,.20);
}

.service-icon{
    width:46px;
    height:46px;
    border-radius:13px;
    background:rgba(53,215,198,.10);
    display:grid;
    place-items:center;
    color:#42d8ca;
    font-size:20px;
    margin-bottom:20px;
}

.service h3{
    margin-bottom:10px;
    font-size:18px;
    font-weight:700;
}

.service p{
    color:#9eb1b5;
    font-size:13px;
    line-height:2;
}

/* MATERIAL BOX */

.material-box{
    margin-top:25px;
    padding:30px;
}

.material-box h3{
    font-size:22px;
    margin-bottom:12px;
    font-weight:800;
}

.material-box p{
    color:#a8b9bc;
    font-size:14px;
    line-height:2.2;
}

.material-list{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-top:20px;
}

.material-list span{
    padding:7px
